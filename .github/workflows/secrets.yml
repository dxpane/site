name: secrets

# gitleaks over the whole git history on every PR and push: a secret must never reach GitHub. Reviewed false
# positives are listed by fingerprint in .gitleaksignore (commit:file:rule:line), so new findings still fail.
on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
      - name: scan history
        run: ./gitleaks git . --no-banner --redact --verbose
