name: gate

# Merge gate: sets the commit status `dxpane/gate` on the head commit of every open PR.
#   green   — all checks on the head commit passed, and (PRs into dev) a Claude review verdict for exactly that commit
#             says PASS ("VERDICT: PASS <head sha>" in a comment by the review bot)
#   pending — checks still running, or no current review yet (comment "@claude review again" after new pushes)
#   red     — a check failed, or the review said VERDICT: BLOCK
# Re-evaluates when a PR changes and whenever a check workflow finishes. GitHub enforces it only where a ruleset
# requires it (public repos on the free plan); elsewhere the rule is: merge only on a green gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [ci, secrets, images, claude, terraform-global]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

concurrency:
  group: gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: evaluate open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import json, os, subprocess

          repo = os.environ["REPO"]
          def gh(path, *args):
              return json.loads(subprocess.check_output(["gh", "api", path, *args]))
          def gh_all(path):  # paginated list endpoints
              out = subprocess.check_output(["gh", "api", "--paginate", "--slurp", path])
              return [item for page in json.loads(out) for item in page]

          IGNORED = {"gate", "claude"}  # the gate itself; the review counts through its verdict, not its job status
          REVIEWERS = {"github-actions[bot]", "claude[bot]"}  # only the review bot's comments carry a verdict

          def verdict_for(number, sha):
              """Latest verdict that names this exact head commit; None if the head has not been reviewed."""
              found = None
              for c in gh_all(f"repos/{repo}/issues/{number}/comments?per_page=100"):
                  if c["user"]["login"] not in REVIEWERS:
                      continue
                  for line in c["body"].splitlines():
                      parts = line.strip().strip("`*").split()
                      if len(parts) >= 3 and parts[0] == "VERDICT:" and len(parts[2]) >= 7 and sha.startswith(parts[2].lower()):
                          found = parts[1].upper()
              return found

          for pr in gh_all(f"repos/{repo}/pulls?state=open&per_page=100"):
              number, sha, base = pr["number"], pr["head"]["sha"], pr["base"]["ref"]
              try:
                  latest = {}
                  for run in sorted(gh(f"repos/{repo}/commits/{sha}/check-runs?per_page=100")["check_runs"],
                                    key=lambda r: r["started_at"] or ""):
                      latest[run["name"]] = run
                  checks = {n: r for n, r in latest.items() if n not in IGNORED}
                  running = sorted(n for n, r in checks.items() if r["status"] != "completed")
                  failed = sorted(n for n, r in checks.items()
                                  if r["status"] == "completed" and r["conclusion"] not in ("success", "skipped", "neutral"))
                  verdict = verdict_for(number, sha) if base == "dev" else None

                  if failed:
                      state, text = "failure", "failed: " + ", ".join(failed)
                  elif running or not checks:
                      state, text = "pending", "waiting for: " + (", ".join(running) or "checks to start")
                  elif base == "dev" and verdict is None:
                      state, text = "pending", f"no Claude review of {sha[:7]} yet (comment: @claude review again)"
                  elif base == "dev" and verdict != "PASS":
                      state, text = "failure", f"Claude review of {sha[:7]}: {verdict} - fix, push, @claude review again"
                  else:
                      state, text = "success", "checks green" + (f", Claude review PASS for {sha[:7]}" if base == "dev" else "")
              except Exception as e:  # one broken PR must not stop the others
                  state, text = "error", f"gate could not evaluate: {type(e).__name__}"

              subprocess.check_call(["gh", "api", "-X", "POST", f"repos/{repo}/statuses/{sha}",
                                     "-f", f"state={state}", "-f", "context=dxpane/gate",
                                     "-f", f"description={text[:140]}", "-f", f"target_url={pr['html_url']}"],
                                    stdout=subprocess.DEVNULL)
              print(f"#{number} ({base}) {sha[:7]}: {state} - {text}")
