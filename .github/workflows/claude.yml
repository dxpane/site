name: claude

# Claude Code as PR reviewer (automatic: one pass when a PR into dev opens, to catch problems before they merge)
# and on-demand helper (@claude in comments, any PR or issue).
# Runs on Begli's Claude subscription: the token lives only in GCP Secret Manager (infra-claude-code-oauth-token,
# infra/CI secret layer) and is read per run via keyless Workload Identity Federation (infra/terraform/ci).
# Comment-only: no merges, no pushes to dev/master. @claude only for owner/members/collaborators: on a public repo a
# stranger's comment must not even start the job (it logs into GCP and fetches the token before anything else).
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    branches: [dev]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      vars.CI_WIF_PROVIDER != '' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot') ||
        (github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CI_WIF_PROVIDER }}
          service_account: ${{ vars.CI_SA }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: claude:dxpane/infra-claude-code-oauth-token
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.secrets.outputs.claude }}
          github_token: ${{ github.token }}
          use_sticky_comment: true
          # Automatic review (PR opened into dev): Sonnet to spare the subscription's limits; findings as inline comments
          # on the exact lines + one summary comment. Tools limited to commenting and reading the PR (no push/merge).
          claude_args: >-
            ${{ github.event_name == 'pull_request'
                && '--model claude-sonnet-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
                || '' }}
          prompt: >-
            ${{ github.event_name == 'pull_request' && format('REPO: {0} PR NUMBER: {1}

            Review this pull request. Read REVIEW.md (and CLAUDE.md if present) for what matters in this repository.
            Report only real problems: bugs, security issues (secrets, injection, auth), data loss, broken contracts,
            missing tests for changed behaviour. Skip style nits.

            For each problem, post an inline comment on the exact line with
            mcp__github_inline_comment__create_inline_comment (confirmed: true): severity, what breaks, concrete fix.
            Then post ONE summary with gh pr comment: findings ranked by severity (one line each), or a single line
            saying nothing is wrong. Only post GitHub comments; do not push commits.', github.repository, github.event.pull_request.number) || '' }}
